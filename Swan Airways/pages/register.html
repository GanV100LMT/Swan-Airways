<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../assets/css/register.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Open+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
<header id="header">
      <div class="container">
        <a href="../pages/index.html" class="logo-link">
          <img
            src="../assets/images/logo-light.png"
            alt="Swan Airways"
            class="logo"
          />
        </a>

        <nav class="nav-bar">
          <a href="../pages/shop.html">Shop</a>

          <a href="../pages/hotel.html">Hotel</a>

          <a href="../pages/index.html">Home</a>
        </nav>
      </div>
    </header>
  <body>
    <div id="main">
      <form action="" id="login-form">
        <h2><span>Register </span></h2>
        <div class="input-group">
          <label for="Username">Username</label>
          <input type="Username" id="Username" />
        </div>

        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" />
        </div>

        <div class="input-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="confirm-password" id="confirm-password" />
        </div>
        <button class="login-btn">Register</button>

        <p class="nav">Back to Login? <a href="../pages/login.html">Back</a></p>
      </form>
    </div>
  </body>
</html>
